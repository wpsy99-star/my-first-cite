<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f2">
<title>오늘의 사다리</title>
<style>
:root{--ink:#17241f;--muted:#718078;--paper:#f7f7f2;--card:#fff;--green:#176b4a;--lime:#dafa78;--line:#d9e2dc;--coral:#f27861}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1040px;margin:auto;padding:28px 22px 64px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:54px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.04em}.mark{width:34px;height:34px;border-radius:11px;background:var(--green);color:var(--lime);display:grid;place-items:center;font-size:20px}.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:7px 11px;border-radius:99px}.hero{margin-bottom:30px}.eyebrow{font-size:12px;color:var(--green);font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(38px,7vw,68px);line-height:1.02;letter-spacing:-.065em;margin:12px 0}.hero p{color:var(--muted);margin:0;font-size:16px}.layout{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}.card{background:var(--card);border:1px solid #e9eee9;border-radius:22px;padding:24px;box-shadow:0 12px 35px #1e3c2810}.card h2{font-size:17px;margin:0 0 20px;letter-spacing:-.03em}.field{margin:0 0 18px}.field label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:8px}.hint{font-size:11px;color:var(--muted);font-weight:500}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font:inherit;font-size:14px;outline:none;background:#fcfdfb;color:var(--ink)}.field input:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px #176b4a18}.field textarea{height:156px;resize:vertical;line-height:1.7}.counts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.num{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}.num button{border:0;background:#f4f7f3;color:var(--green);width:38px;height:42px;font-size:19px;cursor:pointer}.num input{border:0;border-radius:0;text-align:center;padding:9px 0;font-weight:800}.primary{border:0;background:var(--green);color:#fff;border-radius:13px;width:100%;padding:15px;font-size:15px;font-weight:800;cursor:pointer;transition:.2s}.primary:hover{background:#10563b;transform:translateY(-1px)}.primary:disabled{opacity:.45;cursor:not-allowed;transform:none}.note{color:var(--muted);font-size:11px;line-height:1.6;margin:13px 2px 0}.play{min-height:490px;position:relative;overflow:hidden}.playhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}.playhead h2{margin:0}.status{color:var(--muted);font-size:12px}.empty{height:385px;display:grid;place-items:center;text-align:center;color:var(--muted)}.emptyIcon{font-size:42px;margin-bottom:12px}.empty strong{display:block;color:var(--ink);margin-bottom:6px}.board{display:none}.board.show{display:block}.names,.prizes{display:grid;gap:4px;text-align:center}.pill{background:#f2f6f2;border-radius:9px;padding:8px 2px;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prizes .pill{font-size:11px}.canvasbox{height:310px;position:relative;margin:10px 0}.canvasbox canvas{width:100%;height:100%;display:block}.legend{display:flex;justify-content:center;gap:18px;color:var(--muted);font-size:11px;margin-top:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:5px}.dot.win{background:var(--coral)}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-top:17px}.result{background:#f5f7f4;border-radius:12px;padding:10px 12px;font-size:12px;display:flex;justify-content:space-between;gap:6px}.result b{overflow:hidden;text-overflow:ellipsis}.result.win{background:#fff0ed;color:#a54432}.rerun{display:block;margin:17px auto 0;border:1px solid var(--line);background:white;border-radius:99px;padding:9px 17px;color:var(--green);font-weight:700;cursor:pointer}.toast{min-height:18px;color:#ae4431;font-size:12px;margin-top:8px}@media(max-width:760px){.wrap{padding:20px 15px 42px}.top{margin-bottom:38px}.layout{grid-template-columns:1fr}.card{padding:20px}.play{min-height:440px}.empty{height:330px}.canvasbox{height:270px}}@media(max-width:430px){.tag{font-size:10px}.hero p{font-size:14px}.card{border-radius:18px}.pill{font-size:10px;padding:7px 1px}.prizes .pill{font-size:9px}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div class="brand"><span class="mark">⌁</span> 오늘의 사다리</div><span class="tag">가볍게, 공정하게</span></header>
<section class="hero"><div class="eyebrow">DECIDE TOGETHER</div><h1>누가 당첨될까요?</h1><p>이름을 넣고 사다리를 타면 오늘의 행운이 정해져요.</p></section>
<section class="layout">
<aside class="card"><h2>게임 설정</h2>
<div class="counts"><div class="field"><label for="people">참가 인원</label><div class="num"><button type="button" data-step="-1" aria-label="인원 줄이기">−</button><input id="people" type="number" min="2" max="12" value="4"><button type="button" data-step="1" aria-label="인원 늘리기">+</button></div></div>
<div class="field"><label for="winnerCount">당첨 인원</label><div class="num"><button type="button" data-step="-1" aria-label="당첨 인원 줄이기">−</button><input id="winnerCount" type="number" min="1" max="4" value="1"><button type="button" data-step="1" aria-label="당첨 인원 늘리기">+</button></div></div></div>
<div class="field"><label for="namesInput">참가자 이름 <span class="hint">한 줄에 한 명씩</span></label><textarea id="namesInput" placeholder="민지&#10;준호&#10;서연&#10;지우">민지
준호
서연
지우</textarea></div>
<button class="primary" id="start">사다리 타기 시작 <span aria-hidden="true">→</span></button><div class="toast" id="error" role="alert"></div><p class="note">이름 수와 참가 인원을 맞춰 주세요. 당첨자는 무작위로 정해지고, 사다리 경로를 따라 결과가 연결됩니다.</p>
</aside>
<section class="card play"><div class="playhead"><h2>사다리 결과</h2><span class="status" id="status">준비됐어요</span></div><div class="empty" id="empty"><div><div class="emptyIcon">↘</div><strong>사다리가 기다리고 있어요</strong><span>왼쪽에서 이름을 확인하고 시작해 주세요.</span></div></div><div class="board" id="board"><div class="names" id="topNames"></div><div class="canvasbox"><canvas id="ladder" aria-label="참가자별 사다리 경로"></canvas></div><div class="prizes" id="bottomNames"></div><div class="legend"><span><i class="dot"></i>일반 경로</span><span><i class="dot win"></i>당첨 경로</span></div><div class="results" id="results"></div><button class="rerun" id="again">다시 섞기 ↻</button></div></section>
</section></main>
<script>
const people=document.querySelector('#people'), winnerCount=document.querySelector('#winnerCount'), namesInput=document.querySelector('#namesInput'), error=document.querySelector('#error');
function clampInputs(){people.value=Math.max(2,Math.min(12,+people.value||2));winnerCount.max=people.value;winnerCount.value=Math.max(1,Math.min(+people.value,+winnerCount.value||1));let rows=namesInput.value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);while(rows.length<+people.value)rows.push(`참가자 ${rows.length+1}`);namesInput.value=rows.slice(0,+people.value).join('\n')}
document.querySelectorAll('.num button').forEach(b=>b.addEventListener('click',()=>{const input=b.parentElement.querySelector('input');input.value=+input.value + +b.dataset.step;clampInputs()}));people.addEventListener('change',clampInputs);winnerCount.addEventListener('change',clampInputs);namesInput.addEventListener('input',()=>{const n=namesInput.value.split(/\n|,/).map(x=>x.trim()).filter(Boolean).length;if(n>=2&&n<=12){people.value=n;winnerCount.max=n;if(+winnerCount.value>n)winnerCount.value=n}});
let game=null;function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function createGame(){clampInputs();const names=namesInput.value.split(/\n|,/).map(x=>x.trim()).filter(Boolean).slice(0,+people.value);if(names.length<2||names.length>12){error.textContent='참가자는 2명부터 12명까지 설정할 수 있어요.';return}if(new Set(names).size!==names.length){error.textContent='같은 이름이 있어요. 이름을 서로 다르게 입력해 주세요.';return}error.textContent='';const n=names.length, rows=Math.max(12,n*4), bars=Array.from({length:rows},()=>Array(n-1).fill(false));for(let r=0;r<rows;r++){for(let c=0;c<n-1;c++){if(!bars[r][c]&&(c===0||!bars[r][c-1])&&Math.random()<.38)bars[r][c]=true}}
const winners=new Set(shuffle(Array.from({length:n},(_,i)=>i)).slice(0,+winnerCount.value));const outcomes=Array(n).fill('꽝');[...winners].forEach(i=>outcomes[i]='당첨');const paths=[];for(let start=0;start<n;start++){let c=start,pts=[[c,0]];for(let r=0;r<rows;r++){if(c>0&&bars[r][c-1]){c--;pts.push([c,r+.5])}else if(c<n-1&&bars[r][c]){pts.push([c+1,r+.5]);c++}pts.push([c,r+1])}paths.push({start,end:c,pts,win:outcomes[c]==='당첨'})}
game={names,rows,bars,outcomes,paths};document.querySelector('#empty').style.display='none';document.querySelector('#board').classList.add('show');document.querySelector('#status').textContent=`${n}명 · 당첨 ${winnerCount.value}명`;document.querySelector('#topNames').style.gridTemplateColumns=`repeat(${n},1fr)`;document.querySelector('#bottomNames').style.gridTemplateColumns=`repeat(${n},1fr)`;document.querySelector('#topNames').innerHTML=names.map(x=>`<div class="pill" title="${escapeHtml(x)}">${escapeHtml(x)}</div>`).join('');document.querySelector('#bottomNames').innerHTML=outcomes.map(x=>`<div class="pill" style="${x==='당첨'?'background:#fff0ed;color:#a54432':''}">${x}</div>`).join('');document.querySelector('#results').innerHTML=paths.map(p=>`<div class="result ${p.win?'win':''}"><b>${escapeHtml(names[p.start])}</b><span>${outcomes[p.end]}</span></div>`).join('');draw();}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(){if(!game)return;const canvas=document.querySelector('#ladder'),box=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=box.width*dpr;canvas.height=box.height*dpr;const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);const {names,rows,bars,paths}=game,w=box.width,h=box.height,pad=18,top=10,bottom=10,dx=(w-pad*2)/(names.length-1),dy=(h-top-bottom)/rows;ctx.lineCap='round';ctx.lineWidth=2;ctx.strokeStyle='#d9e2dc';for(let c=0;c<names.length;c++){ctx.beginPath();ctx.moveTo(pad+c*dx,top);ctx.lineTo(pad+c*dx,h-bottom);ctx.stroke()}for(let r=0;r<rows;r++)for(let c=0;c<names.length-1;c++)if(bars[r][c]){ctx.beginPath();ctx.moveTo(pad+c*dx,top+(r+.5)*dy);ctx.lineTo(pad+(c+1)*dx,top+(r+.5)*dy);ctx.stroke()}for(const p of paths){ctx.beginPath();p.pts.forEach(([c,y],i)=>{const x=pad+c*dx,py=top+y*dy;i?ctx.lineTo(x,py):ctx.moveTo(x,py)});ctx.strokeStyle=p.win?'#f27861':'#176b4a';ctx.lineWidth=p.win?3:2;ctx.globalAlpha=.68;ctx.stroke();ctx.globalAlpha=1}for(let c=0;c<names.length;c++){ctx.beginPath();ctx.arc(pad+c*dx,top,4,0,Math.PI*2);ctx.fillStyle='#176b4a';ctx.fill();ctx.beginPath();ctx.arc(pad+c*dx,h-bottom,4,0,Math.PI*2);ctx.fillStyle=game.outcomes[c]==='당첨'?'#f27861':'#9caaa1';ctx.fill()}}
document.querySelector('#start').addEventListener('click',createGame);document.querySelector('#again').addEventListener('click',createGame);window.addEventListener('resize',draw);clampInputs();
</script></body></html>
